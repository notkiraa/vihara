<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Acara Dibuat · Buku Tamu Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .wrap { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 28px; color:#fff; text-align:center; }
    .check-box { position:relative; display:grid; place-items:center; margin-bottom:28px; }
    .wrap h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; animation: riseIn .6s .5s var(--ease-out) both; }
    .wrap p { opacity:.9; font-size:15px; margin-top:8px; max-width:300px; animation: riseIn .6s .6s var(--ease-out) both; }
    .receipt {
      width:100%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.26);
      backdrop-filter: blur(14px); border-radius:20px; padding:20px; margin-top:28px; text-align:left;
      animation: riseIn .6s .7s var(--ease-out) both;
    }
    .receipt .row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:10px 0; font-size:14px; }
    .receipt .row + .row { border-top:1px dashed rgba(255,255,255,.25); }
    .receipt .k { opacity:.8; white-space:nowrap; } .receipt .v { font-weight:700; text-align:right; }
    .actions { width:100%; margin-top:28px; display:flex; flex-direction:column; gap:12px; animation: riseIn .6s .8s var(--ease-out) both; }
    .btn-white { background:#fff; color: var(--maroon-800); }
    .btn-outline-w { background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.5); }
    .confetti { position:absolute; top:0; width:8px; height:14px; border-radius:2px; opacity:0; }
    .confetti.c1 { left:20%; background:#ffd9e1; animation: fall 1.4s .6s var(--ease-out) forwards; }
    .confetti.c2 { left:40%; background:#fff; animation: fall 1.6s .7s var(--ease-out) forwards; }
    .confetti.c3 { left:60%; background:#f3b7c6; animation: fall 1.3s .65s var(--ease-out) forwards; }
    .confetti.c4 { left:78%; background:#fff; animation: fall 1.7s .75s var(--ease-out) forwards; }
    @keyframes fall {
      0% { opacity:0; transform: translateY(-20px) rotate(0); }
      15%{ opacity:1; }
      100%{ opacity:0; transform: translateY(240px) rotate(300deg); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="bg-gradient" style="position:fixed;"></div>
    <div class="bg-blob a"></div>
    <div class="bg-blob b"></div>

    <span class="confetti c1"></span><span class="confetti c2"></span>
    <span class="confetti c3"></span><span class="confetti c4"></span>

    <div class="wrap">
      <div class="check-box">
        <span class="ripple"></span>
        <div class="success-ring">
          <svg class="check-svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
      </div>

      <h1>Acara Berhasil Dibuat!</h1>
      <p>Acara kebaktian sudah dijadwalkan. Umat kini bisa melihat dan mengisi kehadiran. 🙏</p>

      <div class="receipt">
        <div class="row"><span class="k">Acara</span><span class="v">Kebaktian Minggu Pagi</span></div>
        <div class="row"><span class="k">Pembicara</span><span class="v">Bhikkhu Dhammavaro</span></div>
        <div class="row"><span class="k">Tanggal</span><span class="v mono">Min, 1 Nov 2026</span></div>
        <div class="row"><span class="k">Waktu</span><span class="v mono">09:00 – 11:00</span></div>
        <div class="row"><span class="k">Lokasi</span><span class="v">Dhammasala Utama</span></div>
      </div>

      <div class="actions">
        <button class="btn btn-white" data-nav="buat-acara.html">Buat Acara Lagi</button>
        <button class="btn btn-outline-w" data-nav="home.html">Kembali ke Beranda</button>
      </div>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
